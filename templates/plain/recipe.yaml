# The settings the Plain template exposes.
#
# A recipe POINTS AT the lines the template already has: every `latex`
# pattern below must appear in cv.tex exactly as written, with the
# placeholder replaced by the default. The generator refuses to guess
# when a pattern matches anything other than exactly one place, so a
# recipe and a template that have drifted apart fail loudly instead of
# rendering the wrong thing.
#
# Patterns are SUBSTRINGS, not whole lines, so editing an unrelated part
# of a line does not break the recipe. Keep just enough context for the
# pattern to be unique.
#
# The template itself is unchanged by having a recipe — it renders
# identically whether or not this file exists.
#
# YAML quoting: the values below are single-quoted, because a LaTeX
# backslash is literal in a YAML single-quoted scalar and an escape in a
# double-quoted one. Single quotes mean exactly what is written.
id: plain
name: 'Plain'
description: 'The one-column article CV. The bootstrap template, made adjustable.'

knobs:
  - id: base_size
    label: 'Base font size'
    description: 'The size the body text is set at.'
    type: enum
    default: '10pt'
    options: ['10pt', '11pt', '12pt']
    latex: '\documentclass[<<value>>,letterpaper]{article}'

  - id: margin
    label: 'Page margin'
    description: 'The margin around the page.'
    type: length
    default: '0.75in'
    latex: '\usepackage[margin=<<value>>]{geometry}'

  - id: section_size
    label: 'Section heading size'
    description: 'The size of a section heading.'
    type: enum
    default: '\large'
    options: ['\large', '\Large', '\LARGE', '\huge']
    latex: '{\section}{<<value>>\bfseries}'

  - id: bullet_indent
    label: 'Bullet indent'
    description: 'How far the bullet text is indented from the margin.'
    type: enum
    default: '*'
    options: ['*', '10pt', '14pt', '18pt', '24pt']
    # This is the template's own \setlist line, and the plain dialect
    # does NOT override leftmargin -- so changing it changes the render.
    # The values are enumitem's own leftmargin forms: "*" is the
    # automatic indent, the rest are fixed lengths.
    #
    # It replaced an earlier "bullet spacing" knob, which was dead: the
    # dialect writes an inline "\itemsep2pt" inside \begin{itemize},
    # which overrides the template's \setlist, so that knob was accepted
    # and changed nothing (the rendered PDF was byte-identical). The
    # per-knob liveness check in evergreen/test_recipe.py is what caught
    # it. Making itemsep adjustable needs a renderer change -- dropping
    # the dialect's inline copy -- and that changes shipped renderer
    # behaviour for every plain-dialect template, so it belongs in a
    # workspace rather than in this repo.
    latex: 'leftmargin=<<value>>, itemsep=2pt'
