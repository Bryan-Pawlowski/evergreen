name: evergreen
version: "0.3.1"
description: "A career workspace and LaTeX CV builder: intake your career history, keep it as structured data, and render a tailored CV to PDF."
author: "Bryan-Pawlowski"
license: MIT
homepage: "https://github.com/Bryan-Pawlowski/evergreen"
tags:
  - career
  - cv
  - resume
  - latex
provides_tools:
  - career_init
  - career_list
  - career_ingest
  - career_profile
  - career_match
  - career_build
  - career_templates
  - career_configure
requires_hermes: ">=0.22.0"
